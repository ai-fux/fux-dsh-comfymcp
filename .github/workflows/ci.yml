name: CI

on:
  push:
    branches:
      - master
      - 'snapshot-*'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: comfy-mcp server selftest
        run: node comfy-mcp-server/bin/comfy-mcp-server.mjs --selftest

      - name: MCP host selftest
        run: node mcp/bin/fux-comfymcp-host.mjs --selftest
