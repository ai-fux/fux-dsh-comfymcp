- insert:
    - id: dsh-comfymcp-client
      # 裸包名按 Node 解析链从 dsh 安装可见（包已 link 进部署 node_modules）。
      # 长驻进程内模块记录/生成快照按进程冻结，改动后需重启 DSH 才重载。
      name: dsh-comfymcp-client
      config:
        endpoint: http://127.0.0.1:18800/mcp
        hostCommand: node
        # MCP 宿主入口：填写本仓 mcp/bin/fux-comfymcp-host.mjs 的绝对路径，
        # 例如 <本仓克隆路径>/mcp/bin/fux-comfymcp-host.mjs。
        hostEntry: ''
        # 工作流/产物/结构化数据统一收敛在插件主目录下（缺省 DSH 内置数据目录
        # $DSH_HOME/comfymcp/，子目录 workflows|artifacts|data）；需要检索 ComfyUI
        # 自带模板库时在设置页追加该目录即可。
        # workflowDirs: []
        saveSubdir: dsh-generated
        artifactsDir: ''
        autoUnloadModel: true
        autoConnect: true
        requestTimeoutMs: 30000
        callTimeoutMs: 300000
        # 内嵌 comfy-mcp 服务端：插件自动拉起（port 0 随机端口），无需单独部署/启动。
        # 服务端程序已内置在插件包（vendor/comfy-mcp-server.mjs），无需配置路径；
        # env DSH_COMFYMCP_SERVER_ENTRY 或设置页可显式覆盖。
        # 关闭（设置页「远程地址」模式）则连接上方 endpoint 指向的外置服务。
        embeddedServer: true
        comfyuiUrl: http://127.0.0.1:8000
        # 开箱即用为 mock 后端（离线出 PNG）。真实模式改用 stdio 并把
        # embeddedBackendArgs 指向 ComfyUI 侧 MCP 后端入口：
        #   <ComfyUI 侧 MCP 项目>/mcp/bin/fux-comfyui-mcp.mjs
        embeddedBackend: mock
        embeddedBackendCommand: node
        embeddedBackendArgs: ''
        # embeddedBackend: stdio
        # embeddedBackendArgs: <ComfyUI 侧 MCP 项目>\mcp\bin\fux-comfyui-mcp.mjs
